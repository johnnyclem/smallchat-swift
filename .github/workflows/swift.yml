name: Swift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (library, CLI, and SwiftUI app)
        run: swift build
      - name: Test
        run: swift test
